x-panel-php-build: &panel-php-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    APT_MIRROR: ${WEBINA_APT_MIRROR:-}
    FORCE_APT_IPV4: ${WEBINA_FORCE_APT_IPV4:-1}
    REDIS_PECL_VERSION: ${WEBINA_REDIS_PECL_VERSION:-6.0.2}

# Keep image vendor — bind-mount only writable/runtime paths (not ./backend wholesale).
x-panel-php-volumes: &panel-php-volumes
  - ./backend/.env:/var/www/html/.env
  - ./backend/storage:/var/www/html/storage
  - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
  - webino_agent_sock:/run
  - webino_backups:/var/backups/webino

services:

  web:
    image: ${PANEL_CADDY_IMAGE:-caddy:2-alpine}
    container_name: webinoserver-web
    restart: unless-stopped
    ports:
      - "${PANEL_HTTP_PORT:-2090}:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    networks:
      - webino_panel

  db:
    image: ${PANEL_MARIADB_IMAGE:-mariadb:11}
    container_name: webinoserver-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: webinoserver
      MYSQL_USER: webinoserver
      MYSQL_PASSWORD: ${PANEL_DB_PASSWORD:?PANEL_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${PANEL_DB_ROOT_PASSWORD:?PANEL_DB_ROOT_PASSWORD is required}
    volumes:
      - panel_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - webino_panel

  redis:
    image: ${PANEL_REDIS_IMAGE:-redis:7-alpine}
    container_name: webinoserver-redis
    restart: unless-stopped
    networks:
      - webino_panel

  backend:
    build: *panel-php-build
    container_name: webinoserver-backend
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      WEBINO_BACKUP_DIR: /var/backups/webino
    volumes: *panel-php-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - webino_panel
      - webino_platform

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/next/Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8080
        AGENT_WS_TARGET: http://agent:9091
        PHPMYADMIN_PROXY_TARGET: http://phpmyadmin:80
        PHPPGADMIN_PROXY_TARGET: http://phppgadmin:80
        ROUNDCUBE_PROXY_TARGET: http://roundcube:80
    container_name: webinoserver-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:8080
      API_PROXY_TARGET: http://backend:8080
      AGENT_WS_TARGET: http://agent:9091
      PHPMYADMIN_PROXY_TARGET: http://phpmyadmin:80
      PHPPGADMIN_PROXY_TARGET: http://phppgadmin:80
      ROUNDCUBE_PROXY_TARGET: http://roundcube:80
      AUTH_COOKIE_NAME: webino_auth_token
    depends_on:
      - backend
      - phpmyadmin
      - phppgadmin
      - roundcube
    networks:
      - webino_panel

  phpmyadmin:
    image: ${PANEL_PHPMYADMIN_IMAGE:-phpmyadmin:5-apache}
    container_name: webinoserver-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${WEBINO_MYSQL_HOST:-host.docker.internal}
      PMA_ABSOLUTE_URI: http://frontend:3000/embed/phpmyadmin/
      PMA_SIGNON_URL: http://frontend:3000/embed/phpmyadmin/signon.php
      PMA_VERIFY_URL: http://backend:8080/api/v1/embeds/phpmyadmin/verify
      WEBINO_AGENT_TOKEN: ${WEBINO_AGENT_TOKEN:?WEBINO_AGENT_TOKEN is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
      - ./docker/phpmyadmin/signon.php:/var/www/html/signon.php:ro
    networks:
      - webino_panel

  phppgadmin:
    image: ${PANEL_PHPPGADMIN_IMAGE:-dockage/phppgadmin:latest}
    container_name: webinoserver-phppgadmin
    restart: unless-stopped
    environment:
      PHP_PG_ADMIN_SERVER_HOST: ${WEBINO_PGSQL_HOST:-host.docker.internal}
      PHP_PG_ADMIN_SERVER_PORT: 5432
      PHP_PG_ADMIN_EXTRA_LOGIN_SECURITY: "false"
      PPA_VERIFY_URL: http://backend:8080/api/v1/embeds/phppgadmin/verify
      WEBINO_AGENT_TOKEN: ${WEBINO_AGENT_TOKEN:?WEBINO_AGENT_TOKEN is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/phppgadmin/config.inc.php:/var/www/conf/config.inc.php:ro
      - ./docker/phppgadmin/signon.php:/var/www/signon.php:ro
    networks:
      - webino_panel

  roundcube:
    image: ${PANEL_ROUNDCUBE_IMAGE:-roundcube/roundcubemail:1.6.9-apache}
    container_name: webinoserver-roundcube
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ${WEBINO_IMAP_HOST:-host.docker.internal}
      ROUNDCUBEMAIL_SMTP_SERVER: ${WEBINO_SMTP_HOST:-host.docker.internal}
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBE_DES_KEY:?ROUNDCUBE_DES_KEY is required}
      ROUNDCUBE_VERIFY_URL: http://backend:8080/api/v1/embeds/webmail/verify
      WEBINO_AGENT_TOKEN: ${WEBINO_AGENT_TOKEN:?WEBINO_AGENT_TOKEN is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/roundcube/config.inc.php:/var/roundcube/config/config.inc.php:ro
      - ./docker/roundcube/plugins/panel_autologon:/var/roundcube/plugins/panel_autologon:ro
    networks:
      - webino_panel

  docs:
    profiles:
      - dev
    build:
      context: ./docs
      dockerfile: ../docker/docs/Dockerfile
      args:
        OPENAPI_URL: http://backend:8080/api/v1/openapi.json
    container_name: webinoserver-docs
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - webino_panel

  agent:
    # Privileged host agent — see panel/docs/AGENT_SECURITY.md
    build:
      context: ./agent
      dockerfile: ../docker/agent/Dockerfile
    container_name: webinoserver-agent
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - ../:/opt/WebinoServer:ro
      - /var/lib/webina:/var/lib/webina
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/postfix:/etc/postfix
      - /etc/dovecot:/etc/dovecot
      - /etc/nginx:/etc/nginx
      - /var/mail:/var/mail
      - webino_agent_sock:/run
      - webino_backups:/var/backups/webino
    environment:
      WEBINO_SERVER_ROOT: /opt/WebinoServer
      WEBINO_AGENT_SOCKET: /run/webino-agent.sock
      WEBINO_AGENT_TOKEN: ${WEBINO_AGENT_TOKEN:?WEBINO_AGENT_TOKEN is required}
      WEBINO_BACKUP_DIR: /var/backups/webino
      WEBINO_AGENT_WS_ADDR: :9091
      WEBINO_GIT_ROOT: /var/www/git
      WEBINO_FILES_ROOT: /var/www
      WEBINO_PDNS_PRIMARY_NS: ${WEBINO_PDNS_PRIMARY_NS:-ns1.local.}
      WEBINO_PDNS_HOSTMASTER: ${WEBINO_PDNS_HOSTMASTER:-hostmaster.local.}
      WEBINO_MAIL_VMAP_DIR: /etc/postfix
      WEBINO_MAIL_HOME: /var/mail/vhosts
      WEBINO_DOVECOT_USERDB: /etc/dovecot/users
      WEBINO_NGINX_SITES: /etc/nginx/sites-available
      WEBINO_NGINX_ENABLED: /etc/nginx/sites-enabled
    networks:
      - webino_panel

  scheduler:
    build: *panel-php-build
    container_name: webinoserver-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "0"
      REDIS_HOST: redis
      WEBINO_BACKUP_DIR: /var/backups/webino
    volumes: *panel-php-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]
    networks:
      - webino_panel
      - webino_platform

  worker:
    build: *panel-php-build
    container_name: webinoserver-worker
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "0"
      REDIS_HOST: redis
      WEBINO_BACKUP_DIR: /var/backups/webino
    volumes: *panel-php-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=2"]
    networks:
      - webino_panel
      - webino_platform

networks:
  webino_panel:
    driver: bridge
  webino_platform:
    external: true
    name: webino_platform

volumes:
  panel_db_data:
  webino_agent_sock:
  webino_backups:
