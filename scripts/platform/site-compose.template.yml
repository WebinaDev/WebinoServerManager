# Per-site stack — backend + next on shared platform network.
services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: ${BACKEND_CONTAINER}
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: ${REDIS_HOST}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./backend/.env:/var/www/html/.env
      - ./backend/database/database.sqlite:/var/www/html/database/database.sqlite
      - ./backend/storage:/var/www/html/storage
    networks:
      - webino_platform

  next:
    image: ${NEXT_IMAGE}
    container_name: ${NEXT_CONTAINER}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://${BACKEND_CONTAINER}:8080
      API_PROXY_TARGET: http://${BACKEND_CONTAINER}:8080
      AUTH_COOKIE_NAME: webino_auth_token
    depends_on:
      - backend
    networks:
      - webino_platform

networks:
  webino_platform:
    external: true
    name: ${NETWORK_NAME}
